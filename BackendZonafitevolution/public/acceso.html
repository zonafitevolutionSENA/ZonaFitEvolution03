<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Acceso — Zona Fit Evolution</title>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    .resultado-acceso {
      text-align: center;
      padding: 40px;
      border-radius: 8px;
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
    }
    .permitido { background: #d4edda; color: #155724; }
    .denegado { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <header style="background: var(--color-primario); color: white; padding: 16px; display: flex; justify-content: space-between;">
    <h2>Control de Acceso</h2>
    <a href="panel.html" style="color: var(--color-acento);">← Volver al panel</a>
  </header>

  <main style="padding: 24px; max-width: 500px;">
    <div id="avisoSimulador" style="background: #fff3cd; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 13px;">
      Modo simulador: ingresa el identificador de prueba como si fuera la
      lectura del sensor biométrico.
    </div>

    <div style="background: white; padding: 20px; border-radius: 8px;">
      <label for="identificadorSimulado">Simular lectura de huella</label>
      <input type="text" id="identificadorSimulado" placeholder="Ej: dedo_mario" autocomplete="off" autofocus>
      <button id="btnValidar">Validar acceso</button>
    </div>

    <div id="resultadoAcceso"></div>

    <div style="margin-top: 24px;">
      <h4>Últimos accesos</h4>
      <div id="historialAcceso"></div>
    </div>
  </main>

  <script src="js/auth-guard.js"></script>
  <script src="js/acceso.js"></script>
</body>
</html>
