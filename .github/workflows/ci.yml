# Integración continua: lint, pruebas y compilación en cada pull request y en cada push a develop y main
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pruebas unitarias)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackendZonafitevolution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BackendZonafitevolution/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontendZonafitevolution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FrontendZonafitevolution/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  agente:
    name: Agente del lector (sintaxis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgenteLector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AgenteLector/package-lock.json
      - run: npm ci
      - run: node --check index.js
      - run: npm audit --omit=dev --audit-level=high

  integracion:
    name: Integración (casos CP-001 a CP-022 con MySQL)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: raiz_ci
          MYSQL_DATABASE: zonafitevolution_pruebas
          MYSQL_USER: zonafit_ci
          MYSQL_PASSWORD: clave_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -praiz_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: zonafit_ci
      DB_PASSWORD: clave_ci
      DB_NAME: zonafitevolution_pruebas
      TZ: America/Bogota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: |
          npm ci --prefix BackendZonafitevolution
          npm ci --prefix FrontendZonafitevolution
      - name: Crear el esquema con init.sql
        run: mysql -h 127.0.0.1 -u zonafit_ci -pclave_ci zonafitevolution_pruebas < BackendZonafitevolution/database/init.sql
      - name: Ejecutar el ciclo de pruebas
        working-directory: BackendZonafitevolution
        run: npm run pruebas-cp -- ../reporte-cic.md
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cic
          path: reporte-cic.md
